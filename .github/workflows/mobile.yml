name: Native mobile checks

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Native build to run on demand'
        type: choice
        default: both
        options: [ios, android, both]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Core and full-scan parser tests
        working-directory: mobile/ios
        run: swift test
      - name: Build simulator app
        run: >-
          xcodebuild -project mobile/ios/OpenSourceOrthoLite.xcodeproj
          -scheme OpenSourceOrthoLite -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test, lint, and build
        working-directory: mobile/android
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
