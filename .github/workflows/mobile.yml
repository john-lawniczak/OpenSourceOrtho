name: Native mobile checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core and full-scan parser tests
        working-directory: mobile/ios
        run: swift test
      - name: Build simulator app
        run: >-
          xcodebuild -project mobile/ios/OpenSourceOrthoLite.xcodeproj
          -scheme OpenSourceOrthoLite -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test, lint, and build
        working-directory: mobile/android
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
