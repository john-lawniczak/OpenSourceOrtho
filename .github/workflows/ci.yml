name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Optional test suite (quick runs only the inexpensive checks)'
        type: choice
        default: quick
        options: [quick, python, geometry, browser, all]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick checks
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install lightweight development dependencies
        run: pip install -e ".[dev]"
      - name: Lint, catalog, and maintainability
        run: |
          ruff check .
          python tools/build_dataset_catalog.py --check
          python tools/check_maintainability.py --strict
      - name: JavaScript unit tests
        working-directory: ui
        run: node --test

  python:
    name: Python tests
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'python' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest --ignore=tests/e2e -q

  mesh-processing:
    name: Open3D robust shell tests
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'geometry' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install mesh-processing extra
        run: pip install -e ".[dev,mesh-processing]"
      - name: Robust shell backend tests
        run: pytest tests/test_shell_backend.py tests/test_validation_benchmarks.py -q

  motion-preview:
    name: Endpoint matching and motion preview
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'geometry' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline fitting tools
        run: pip install -e ".[dev,motion-preview,ml-seg,volume-review]" onnx
      - name: Fit known motions and verify sample artifacts
        run: >-
          pytest tests/test_endpoint_motion.py tests/test_sample_motion_artifacts.py
          tests/test_motion_benchmark.py tests/test_motion_corrections.py
          tests/test_motion_registration.py tests/test_motion_workflow.py
          tests/test_motion_simulation.py tests/test_surface_topology.py
          tests/test_model_contract.py tests/test_match_review.py
          tests/test_full_surface_contact.py tests/test_dicom_volume_review.py
          tests/test_motion_stress.py tests/test_motion_review.py
          tests/test_correspondence_assignment.py tests/test_user_one_annotation.py -q

  e2e:
    name: 3D viewer smoke (Playwright)
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'browser' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,e2e,motion-preview]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Viewer smoke
        run: pytest tests/e2e/test_tooth_goals.py -q --basetemp "${{ runner.temp }}/ortho-pick"
      - name: Browser suite
        run: pytest tests/e2e --ignore=tests/e2e/test_tooth_goals.py -q --basetemp "${{ runner.temp }}/ortho-e2e"
      - name: Browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshots
          retention-days: 3
          path: |
            ${{ runner.temp }}/ortho-pick/**/*.png
            ${{ runner.temp }}/ortho-e2e/**/*.png
